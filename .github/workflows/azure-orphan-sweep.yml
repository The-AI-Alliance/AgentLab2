name: Azure orphan sweep

# L4 defense layer for orphaned-VM accumulation: runs independently of the
# harness on a 6-hour cron, calling cleanup_stale() against a configured
# resource group. Catches orphans left by SIGKILL/OOM-killed runs that bypass
# the per-task `finally` block, and is the only layer that fires when no
# benchmark run is happening at all.
#
# Required repository secrets (configure under Settings → Secrets → Actions):
#   AZURE_CLIENT_ID         — federated identity client ID
#   AZURE_TENANT_ID         — Azure AD tenant
#   AZURE_SUBSCRIPTION_ID   — target subscription
# Required repository variable:
#   AZURE_RESOURCE_GROUP    — resource group to sweep (e.g. "ui_assist")
#
# OIDC federation must be configured on the Azure side: the federated identity
# must trust this repo + workflow. See:
# https://learn.microsoft.com/azure/active-directory/workload-identities/workload-identity-federation-create-trust

on:
  schedule:
    # Every 6 hours. Cheaper than hourly (90% of orphan cost is captured at 6h
    # cadence given Azure D4s_v3 pricing), and quieter than daily.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      resource_group:
        description: "Override resource group (defaults to AZURE_RESOURCE_GROUP variable)"
        required: false
        type: string
      max_age_seconds:
        description: "Also delete cube-tagged resources older than this (optional, in seconds)"
        required: false
        type: string
      dry_run:
        description: "Authenticate and report without deleting"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write # OIDC federation
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install cube-infra-azure + typer
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python \
            "cube-infra-azure @ git+https://github.com/The-AI-Alliance/cube-standard.git@dev#subdirectory=cube-resources/cube-infra-azure" \
            "typer>=0.12"

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run sweeper
        env:
          AZURE_RESOURCE_GROUP: ${{ inputs.resource_group || vars.AZURE_RESOURCE_GROUP }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.max_age_seconds }}" ]; then
            ARGS="$ARGS --max-age-seconds ${{ inputs.max_age_seconds }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          .venv/bin/python scripts/azure_orphan_sweep.py $ARGS
