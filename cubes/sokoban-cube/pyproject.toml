[project]
name = "sokoban-cube"
version = "0.1.0"
description = "Procedurally generated Sokoban puzzles (6x6 board, 2 boxes) — push every box onto a goal"
requires-python = ">=3.12"
dependencies = [
    "cube-standard",
]

[project.entry-points."cube.benchmarks"]
# The key is the benchmark name shown by `cube list`.
sokoban-cube = "sokoban_cube.benchmark:SokobanBenchmarkConfig"

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.ruff]
fix = true
line-length = 120
indent-width = 4
