[project]
name = "swegym-lite-cube"
version = "0.1.0"
description = "SWE-Gym Lite — 230 executable real-world GitHub issues with test-based validation"
requires-python = ">=3.12"
dependencies = [
    "cube-standard[docker]>=0.1.0rc8",
    "datasets",
]

[project.entry-points."cube.benchmarks"]
swegym-lite-cube = "swegym_lite_cube.benchmark:SWEGymLiteBenchmarkConfig"

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv-build]
include = ["src/swegym_lite_cube/task_metadata.json"]

[tool.uv.sources]
cube-standard = { git = "https://github.com/The-AI-Alliance/cube-standard", branch = "dev" }

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.ruff]
fix = true
line-length = 120
indent-width = 4
