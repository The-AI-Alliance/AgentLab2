[project]
name = "swegym-cube"
version = "0.1.0"
description = "SWE-Gym — 2438 executable real-world GitHub issues with test-based validation (with an official 230-task lite subset)"
license = "Apache-2.0"
authors = [
    { name = "Alexandre Lacoste", email = "alex.lacoste.shmu@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    # rc9 is the first release with cube.resource.IncompatibleInfraError (used by the
    # non-root writability probe). The pip-based registry check resolves this from PyPI.
    "cube-standard[docker]>=0.1.0rc9",
    "datasets",
]

[project.entry-points."cube.benchmarks"]
swegym-cube = "swegym_cube.benchmark:SWEGymBenchmarkConfig"

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv-build]
include = ["src/swegym_cube/task_metadata.json"]

[tool.uv.sources]
cube-standard = { git = "https://github.com/The-AI-Alliance/cube-standard", branch = "dev" }

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.ruff]
fix = true
line-length = 120
indent-width = 4
