# REGISTRY: do NOT add this cube to cube-registry (no `cube registry add` / `--submit`).
# arithmetic-cube is a demo/reference benchmark for examples & tests only — not a real
# benchmark for the public catalog. Intentionally excluded. (note for humans + AI agents)
[project]
name = "arithmetic-cube"
version = "0.1.0"
description = "Simple arithmetic benchmark — submit the correct answer to math problems"
requires-python = ">=3.12"
dependencies = [
    "cube-standard>=0.1.0rc8",
]

[project.entry-points."cube.benchmarks"]
arithmetic-cube = "arithmetic_cube.benchmark:ArithmeticBenchmarkConfig"

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.ruff]
fix = true
line-length = 120
indent-width = 4
