legal:
  wrapper_license: Apache-2.0
  benchmark_license:
    reported: Apache-2.0
    source_url: "https://github.com/ServiceNow/drbench/blob/main/LICENSE"
    verified_by_original_authors: true
  notices:
  - type: third_party_data
    description: >
      DRBench dataset hosted on HuggingFace (ServiceNow/drbench). Tasks are
      synthetic enterprise scenarios; no real company data is included.
    url: "https://huggingface.co/datasets/ServiceNow/drbench"

paper: "https://arxiv.org/abs/2510.00172"
getting_started_url: "https://github.com/The-AI-Alliance/cube-harness/tree/main/cubes/drbench-cube"

tags:
- nlp
- reasoning
- docker

max_concurrent_tasks: 8
parallelization_mode: task-parallel

status: experimental
task_count: 100
has_debug_task: true
has_debug_agent: true
resources: []
action_space: []
features:
  async: false
  streaming: false
  multi_agent: false
  multi_dim_reward: false
