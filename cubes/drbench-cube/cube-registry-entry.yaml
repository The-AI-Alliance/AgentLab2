id: drbench-cube
name: "DRBench"
version: "0.2.1"
description: >
  DRBench evaluates agents on 100 enterprise deep research tasks requiring
  multi-hop retrieval across Nextcloud, Mattermost, email, and web. Each task
  is grounded in a realistic company scenario with a persona, credentials, and
  a research question. Scoring uses an LLM judge (insights recall + factuality
  harmonic mean). Requires Docker and an OpenAI-compatible API key for scoring.
package: drbench-cube
dev_install_url: "git+https://github.com/The-AI-Alliance/cube-harness#subdirectory=cubes/drbench-cube"

